name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build pack zip
        run: |
          VERSION=${GITHUB_REF_NAME}
          zip -r "megaman3-ap-poptracker-${VERSION}.zip" megaman3-ap-poptracker/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: megaman3-ap-poptracker-*.zip
          generate_release_notes: true
